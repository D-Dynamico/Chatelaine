<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chatelaine</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap"
    />
    <!-- Only the icons UI.md uses (§22). icon_names must stay in alphabetical order. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=archive,block,check,check_circle,close,cloud_off,contrast,dark_mode,delete,edit,expand_less,expand_more,light_mode,lock,logout,more_vert,pending,person_add,radio_button_unchecked,refresh,search,timeline,visibility,visibility_off&display=block"
    />
  </head>
  <body>
    <!-- Static splash (§16): on screen until the app initializer resolves, then replaced
         when Angular renders into app-root. The initializer writes into #boot-status. -->
    <app-root>
      <main class="boot-splash">
        <p class="boot-splash__name">Chatelaine</p>
        <p id="boot-status" class="boot-splash__status" role="status" aria-live="polite">
          Connecting to the server
        </p>
      </main>
    </app-root>
    <noscript>Chatelaine needs JavaScript to run.</noscript>
  </body>
</html>
