<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chatelaine</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap"
    />
    <!-- Only the icons UI.md uses (§22). icon_names must stay in alphabetical order. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=archive,block,check,check_circle,close,cloud_off,contrast,dark_mode,delete,edit,expand_less,expand_more,light_mode,lock,logout,more_vert,pending,person_add,radio_button_unchecked,refresh,search,timeline,visibility,visibility_off&display=block"
    />
  </head>
  <body>
    <!-- Static splash (§16): covers the page until the first route has rendered, then
         provideBootSplash() removes it. The boot sequence writes into #boot-status. -->
    <div id="boot-splash" class="boot-splash">
      <svg class="boot-splash__mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="8.5" cy="8.5" r="5.5" />
        <path d="M12.5 12.5 21 21M17 17l2.5-2.5M19.5 19.5l1.75-1.75" />
      </svg>
      <p class="boot-splash__name">Chatelaine</p>
      <p id="boot-status" class="boot-splash__status" role="status" aria-live="polite">
        Connecting to the server
      </p>
    </div>
    <app-root></app-root>
    <noscript>Chatelaine needs JavaScript to run.</noscript>
  </body>
</html>
