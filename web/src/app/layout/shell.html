<header class="top-bar">
  <div class="bar">
    <a class="brand" [routerLink]="paths.dashboard"><app-brand-mark />Chatelaine</a>
    <nav class="nav" aria-label="Main">
      <a [routerLink]="paths.dashboard" routerLinkActive="active" ariaCurrentWhenActive="page">
        Dashboard
      </a>
      @if (session.isAdmin()) {
        <a [routerLink]="paths.adminUsers" routerLinkActive="active" ariaCurrentWhenActive="page">
          Users
        </a>
      }
    </nav>
    <div class="actions">
      <button
        #timelineButton
        mat-button
        type="button"
        class="timeline-button"
        aria-controls="latency-lab"
        [attr.aria-expanded]="isLabOpen()"
        [attr.aria-label]="timelineLabel()"
        (click)="toggleLab()"
      >
        <mat-icon aria-hidden="true">timeline</mat-icon>
        <span class="timeline-text">Timeline</span>
        @if (pendingCount() > 0) {
          <span class="count tabular" aria-hidden="true">{{ pendingCount() }}</span>
        }
      </button>
      <app-theme-menu [preference]="theme.preference()" (choose)="theme.choose($event)" />
      @if (session.user(); as user) {
        <app-account-menu [user]="user" (signOut)="signOut()" />
      }
    </div>
  </div>
  <div class="progress">
    @if (isLoading()) {
      <mat-progress-bar mode="indeterminate" aria-label="Loading" />
    }
  </div>
</header>
<main class="content">
  <router-outlet />
</main>

@if (isLabOpen()) {
  <!-- Not modal: the point is to watch the page load while the timeline draws. -->
  <aside
    #drawer
    id="latency-lab"
    class="lab"
    tabindex="-1"
    aria-label="Latency lab"
    (keydown.escape)="closeLab()"
  >
    @defer (on immediate) {
      <app-latency-lab-panel [canReloadDashboard]="isOnDashboard()" (dismiss)="closeLab()" />
    } @placeholder {
      <p class="lab-loading">Loading the latency lab.</p>
    }
  </aside>
}
