<table
  mat-table
  class="users"
  [dataSource]="rows()"
  matSort
  [matSortActive]="activeSort()"
  [matSortDirection]="sort().order"
  (matSortChange)="onSort($event)"
>
  <ng-container matColumnDef="user">
    <th mat-header-cell *matHeaderCellDef mat-sort-header="displayName">User</th>
    <td mat-cell data-label="User" *matCellDef="let user" class="user">
      <span class="name">
        {{ user.displayName }}
        @if (isSelf(user)) {
          <span class="you">You</span>
        }
      </span>
      <span class="secondary tabular">{{ user.userId }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef mat-sort-header="role">Role</th>
    <td mat-cell data-label="Role" *matCellDef="let user">
      <app-role-badge [tone]="role(user.role).tone" [label]="role(user.role).label" />
    </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef mat-sort-header="status">Status</th>
    <td mat-cell data-label="Status" *matCellDef="let user">
      <app-status-chip [label]="status(user.status).label" [icon]="status(user.status).icon" />
    </td>
  </ng-container>

  <ng-container matColumnDef="department">
    <th mat-header-cell *matHeaderCellDef>Department</th>
    <td mat-cell data-label="Department" *matCellDef="let user">{{ user.department }}</td>
  </ng-container>

  <ng-container matColumnDef="lastLoginAt">
    <th mat-header-cell *matHeaderCellDef mat-sort-header="lastLoginAt">Last sign-in</th>
    <td mat-cell data-label="Last sign-in" *matCellDef="let user">
      @if (user.lastLoginAt; as at) {
        <app-relative-time [at]="at" [now]="now()" />
      } @else {
        <span class="secondary">Never</span>
      }
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef><span class="visually-hidden">Actions</span></th>
    <td mat-cell *matCellDef="let user" class="actions">
      <button
        mat-icon-button
        type="button"
        [matMenuTriggerFor]="menu"
        [attr.aria-label]="'Actions for ' + user.displayName"
      >
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu" xPosition="before">
        <button mat-menu-item type="button" data-action="edit" (click)="edit.emit(user)">
          <mat-icon>edit</mat-icon>
          Edit user
        </button>
        @if (user.status === 'ACTIVE') {
          <button
            mat-menu-item
            type="button"
            data-action="disable"
            [disabled]="isSelf(user)"
            disabledInteractive
            [matTooltip]="isSelf(user) ? reasons.disable : ''"
            matTooltipPosition="before"
            (click)="requestDisable(user)"
          >
            <mat-icon>block</mat-icon>
            Disable user
          </button>
        } @else {
          <button mat-menu-item type="button" data-action="enable" (click)="enable.emit(user)">
            <mat-icon>check_circle</mat-icon>
            Enable user
          </button>
        }
        <button
          mat-menu-item
          type="button"
          data-action="delete"
          [disabled]="isSelf(user)"
          disabledInteractive
          [matTooltip]="isSelf(user) ? reasons.delete : ''"
          matTooltipPosition="before"
          (click)="requestRemove(user)"
        >
          <mat-icon>delete</mat-icon>
          Delete user
        </button>
      </mat-menu>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns" class="header-row"></tr>
  <tr mat-row *matRowDef="let user; columns: columns" class="user-row"></tr>
</table>

<mat-paginator
  [length]="page().total"
  [pageIndex]="page().page - 1"
  [pageSize]="page().pageSize"
  [hidePageSize]="true"
  (page)="onPage($event)"
  aria-label="Pages of users"
/>
