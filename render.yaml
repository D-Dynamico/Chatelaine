# Render blueprint for the API (docs/WORKFLOWS.md §29). One free web service; the web app is
# deployed separately (web/vercel.json). Secrets are never in this file: `sync: false` makes
# Render ask for the value in its dashboard, and JWT_SECRET is generated there.
services:
  - type: web
    name: chatelaine-api
    runtime: node
    plan: free
    rootDir: api
    # Render sets NODE_ENV=production for the build too, and npm then skips devDependencies,
    # but the build needs tsc and rimraf. --include=dev puts them back for this step only.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Matches .nvmrc. Without it Render resolves "node >=24" to the newest major it has.
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: STORAGE
        value: mongo
      # The MongoDB Atlas connection string, pasted into the dashboard.
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: chatelaine
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL
        value: 2h
      # The deployed web app's origin, with no trailing slash, pasted into the dashboard.
      - key: CORS_ORIGIN
        sync: false
      # One proxy (Render's) sits in front of the app; the login rate limit keys on req.ip.
      - key: TRUST_PROXY
        value: "1"
      - key: SIMULATION_ENABLED
        value: "true"
