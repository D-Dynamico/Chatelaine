# Local backing services for the mongo and dynamo storage adapters (docs/WORKFLOWS.md §28).
# The file adapter needs neither. Versions are pinned: mongo matches what Atlas free
# clusters run, and DynamoDB Local is kept in memory so every start is clean.
services:
  mongo:
    image: mongo:8
    ports:
      - '27017:27017'

  dynamodb:
    image: amazon/dynamodb-local:3.1.0
    command: ['-jar', 'DynamoDBLocal.jar', '-inMemory', '-sharedDb']
    ports:
      - '8000:8000'
